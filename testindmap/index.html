<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>テスト仕様書エディター</title>
    <script src="https://cdn.jsdelivr.net/npm/monomd@1.0.5/index.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style id="monomd-css"></style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
            overflow: hidden;
        }

        #canvas.grabbing {
            cursor: grabbing;
        }

        #canvas-content {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }

        .node {
            position: absolute;
            background: white;
            border: 3px solid #667eea;
            border-radius: 12px;
            padding: 15px;
            min-width: 200px;
            max-width: 800px;
            min-height: 100px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: move;
            z-index: 2;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.3s, background-color 0.3s;
            resize: none;
            display: flex;
            flex-direction: column;
        }

        .node:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .node.dragging {
            opacity: 0.8;
            z-index: 1000;
            max-width: none !important;
        }

        .node.selected {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.3);
        }

        .node.resizing {
            transition: none;
        }

        .node.resizing:hover {
            transform: none;
        }

        .view-mode {
            flex: 1;
            overflow: auto;
        }

        /* リサイズハンドル */
        .resize-handle {
            position: absolute;
            background: transparent;
            z-index: 11;
        }

        .resize-handle.top {
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            cursor: ns-resize;
        }

        .resize-handle.bottom {
            bottom: 0;
            left: 0;
            right: 0;
            height: 8px;
            cursor: ns-resize;
        }

        .resize-handle.left {
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
        }

        .resize-handle.right {
            right: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
        }

        .resize-handle:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        /* タッチデバイス用にリサイズハンドルを大きく */
        @media (pointer: coarse) {
            .resize-handle.top,
            .resize-handle.bottom {
                height: 16px;
            }
            
            .resize-handle.left,
            .resize-handle.right {
                width: 16px;
            }
        }

        /* コネクター */
        .connector {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #667eea;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
            opacity: 0;
        }

        .node:hover .connector {
            opacity: 1;
        }

        .connector:hover {
            width: 16px;
            height: 16px;
            background: #5568d3;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
        }

        .connector.active {
            opacity: 1;
            background: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        /* タッチデバイス用にコネクターを大きく */
        @media (pointer: coarse) {
            .connector {
                width: 20px;
                height: 20px;
            }
            
            .connector:hover,
            .connector:active {
                width: 24px;
                height: 24px;
            }
            
            .connector.top {
                top: -10px;
            }
            
            .connector.bottom {
                bottom: -10px;
            }
            
            .connector.left {
                left: -10px;
            }
            
            .connector.right {
                right: -10px;
            }
        }

        .connector.top {
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
        }

        .connector.bottom {
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
        }

        .connector.left {
            left: -6px;
            top: 50%;
            transform: translateY(-50%);
        }

        .connector.right {
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
        }

        .connector.top:hover,
        .connector.top.active {
            transform: translateX(-50%) scale(1.3);
        }

        .connector.bottom:hover,
        .connector.bottom.active {
            transform: translateX(-50%) scale(1.3);
        }

        .connector.left:hover,
        .connector.left.active {
            transform: translateY(-50%) scale(1.3);
        }

        .connector.right:hover,
        .connector.right.active {
            transform: translateY(-50%) scale(1.3);
        }

        /* ステータスによるノードスタイル変更 */
        .node.status-OK {
            border-color: #2ecc71;
            border-width: 3px;
        }

        .node.status-条件付OK {
            border-color: #f39c12;
            border-width: 3px;
        }

        .node.status-NG {
            border-color: #e74c3c;
            border-width: 3px;
        }

        .node.status-却下 {
            background-color: #e0e0e0;
        }

        .node.status-保留 {
            background-color: #e6d5f5;
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e0e0e0;
            gap: 10px;
        }

        .node-left-section {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 80px;
        }

        .node-id-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        /* テスト種別プルダウン */
        .test-type {
            padding: 4px 8px;
            border: 2px solid #667eea;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            width: 100%;
        }

        .test-type:focus {
            outline: none;
            border-color: #5568d3;
        }

        .test-type.type-正常系 {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        .test-type.type-異常系 {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        .test-type.type-その他 {
            background-color: #95a5a6;
            color: white;
            border-color: #7f8c8d;
        }

        .node-id {
            font-weight: bold;
            color: #667eea;
            font-size: 14px;
            min-width: 60px;
            padding: 4px 8px;
            background: #f0f4ff;
            border-radius: 4px;
            cursor: text;
            border: 1px solid transparent;
            transition: all 0.2s;
            word-wrap: break-word;
            word-break: break-all;
            overflow-wrap: break-word;
        }

        .node-id:hover {
            border-color: #667eea;
        }

        .node-id:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .node-status {
            padding: 4px 10px;
            border: 2px solid #667eea;
            border-radius: 4px;
            background: white;
            color: #333;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            width: 100%;
        }

        .node-status:hover {
            background: #f0f4ff;
        }

        .node-status:focus {
            outline: none;
            border-color: #5568d3;
        }

        .node-status.status-起票 {
            border-color: #95a5a6;
            color: #95a5a6;
        }

        .node-status.status-OK {
            border-color: #2ecc71;
            color: #2ecc71;
        }

        .node-status.status-条件付OK {
            border-color: #f39c12;
            color: #f39c12;
        }

        .node-status.status-NG {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .node-status.status-却下 {
            border-color: #95a5a6;
            color: #95a5a6;
        }

        .node-status.status-保留 {
            border-color: #95a5a6;
            color: #95a5a6;
        }

        .node-status option:disabled {
            color: #ccc;
        }

        .node-controls {
            display: flex;
            gap: 5px;
        }

        .node-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .node-btn:hover {
            background: #5568d3;
        }

        .node-btn.delete {
            background: #ff6b6b;
        }

        .node-btn.delete:hover {
            background: #ee5a52;
        }

        .node-content {
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: background-color 0.2s;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .node-content:hover {
            background-color: #f8f9fa;
        }

        /* スマホでのスクロールを改善 */
        .node-content .monomd-body {
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }

        .edit-mode {
            display: none;
            height: 100%;
        }

        .node.editing .edit-mode {
            display: flex;
            flex-direction: column;
        }

        .node.editing .view-mode {
            display: none;
        }

        .node-textarea {
            width: 100%;
            height: 100%;
            min-height: 100px;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            resize: none;
            box-sizing: border-box;
        }

        .toolbar {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .toolbar button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            margin-right: 10px;
        }

        .toolbar button:hover {
            background: #5568d3;
        }

        /* ハンバーガーメニュー用のスタイル */
        .hamburger-btn {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 0;
            padding: 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1001;
        }

        .hamburger-menu {
            display: none;
            position: fixed;
            bottom: 50px;
            left: 0;
            right: 0;
            background: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }

        .hamburger-menu.open {
            transform: translateY(0);
        }

        .hamburger-menu button {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .hamburger-menu button:hover {
            background: #5568d3;
        }

        .hamburger-menu button:last-child {
            margin-bottom: 0;
        }

        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }

        .menu-overlay.show {
            display: block;
        }

        .info {
            display: none;
        }

        /* モーダルウィンドウ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-header h3 {
            margin: 0;
            color: #667eea;
            font-size: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #f0f0f0;
            color: #667eea;
        }

        .modal-body ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .modal-body li {
            margin-bottom: 12px;
            padding-left: 20px;
            position: relative;
            line-height: 1.6;
        }

        .modal-body li:before {
            content: "▸";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        /* 画像拡大表示用モーダル */
        .image-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }

        .image-modal-overlay.show {
            display: flex;
        }

        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            font-size: 40px;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .image-modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ノード内の画像にカーソルを設定 */
        .node-content img {
            cursor: zoom-in;
        }

        /* モバイル対応 */
        @media (max-width: 768px) {
            .toolbar {
                display: none;
            }
            
            .hamburger-btn {
                display: block;
            }
            
            .hamburger-menu {
                display: block;
            }
        }

        .connection {
            stroke: white;
            stroke-width: 2;
            opacity: 0.8;
            pointer-events: stroke;
            cursor: pointer;
            marker-end: url(#arrowhead);
        }

        .connection:hover {
            stroke-width: 4;
            opacity: 1;
        }

        .context-menu {
            position: fixed;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            min-width: 150px;
            display: none;
        }

        .context-menu.show {
            display: block;
        }

        .context-menu-item {
            padding: 10px 15px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
        }

        .context-menu-item:last-child {
            border-bottom: none;
        }

        .context-menu-item:hover {
            background: #f0f4ff;
        }

        .context-menu-item:first-child {
            border-radius: 6px 6px 0 0;
        }

        .context-menu-item:last-child {
            border-radius: 0 0 6px 6px;
        }

        .context-menu-item.delete {
            color: #e74c3c;
            font-weight: 500;
        }

        .context-menu-item.delete:hover {
            background: #fee;
        }

        /* エクスポートメニュー */
        /* エクスポートメニュー（モーダル） */
        .export-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .export-modal-overlay.show {
            display: flex;
        }

        .export-modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .export-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .export-modal-header h4 {
            margin: 0;
            color: #667eea;
            font-size: 20px;
        }

        .export-modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .export-modal-close:hover {
            background: #f0f0f0;
            color: #667eea;
        }

        .export-modal-body button {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
            margin-bottom: 10px;
            text-align: left;
        }

        .export-modal-body button:last-child {
            margin-bottom: 0;
        }

        .export-modal-body button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="clearBtn">🗑️ すべてクリア</button>
        <button id="importBtn">📂 インポート</button>
        <button id="exportBtn">💾 エクスポート</button>
        <button id="addNodeBtn">➕ ノード追加</button>
        <button id="helpBtn">📝 操作方法</button>
    </div>
    
    <!-- ハンバーガーメニュー（スマホ版） -->
    <button class="hamburger-btn" id="hamburgerBtn"><i class="fas fa-bars"></i> メニュー</button>
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="hamburger-menu" id="hamburgerMenu">
        <button id="clearBtnMobile">🗑️ すべてクリア</button>
        <button id="importBtnMobile">📂 インポート</button>
        <button id="exportBtnMobile">💾 エクスポート</button>
        <button id="addNodeBtnMobile">➕ ノード追加</button>
        <button id="helpBtnMobile">📝 操作方法</button>
    </div>
    
    <input type="file" id="fileInput" accept=".tsv,.json" style="display: none;">

    <!-- 操作方法モーダル -->
    <div class="modal-overlay" id="helpModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📝 操作方法</h3>
                <button class="modal-close" id="modalCloseBtn">×</button>
            </div>
            <div class="modal-body">
                <ul>
                    <li>ノードをドラッグして移動</li>
                    <li>ノードの4辺をドラッグでリサイズ</li>
                    <li>テストケースIDをクリックして編集</li>
                    <li>種別で正常系/異常系を選択</li>
                    <li>ステータスでノードの見た目が変化</li>
                    <li>マークダウン部分をダブルクリックで編集</li>
                    <li>編集中は外側クリックで自動保存</li>
                    <li>ノードの4方向の点をクリックして接続</li>
                    <li>ノードを右クリックで削除</li>
                    <li>接続線を右クリックで削除</li>
                    <li>背景をドラッグして全体移動</li>
                    <li>2本指でピンチズーム（スマホ）</li>
                </ul>
            </div>
        </div>
    </div>

    <div id="canvas">
        <div id="canvas-content">
            <svg id="svg"></svg>
        </div>
    </div>

    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item delete" id="deleteNode">🗑️ ノードを削除</div>
        <div class="context-menu-item delete" id="deleteConnection">🗑️ 接続を削除</div>
    </div>

    <!-- エクスポートメニュー（モーダル） -->
    <div class="export-modal-overlay" id="exportModal">
        <div class="export-modal-content">
            <div class="export-modal-header">
                <h4>📥 エクスポート形式を選択</h4>
                <button class="export-modal-close" id="exportModalCloseBtn">×</button>
            </div>
            <div class="export-modal-body">
                <button id="exportTsvBtn">📄 TSV形式</button>
                <button id="exportJsonBtn">📋 JSON形式</button>
            </div>
        </div>
    </div>

    <!-- 画像拡大表示モーダル -->
    <div class="image-modal-overlay" id="imageModal">
        <button class="image-modal-close" id="imageModalCloseBtn">×</button>
        <img class="image-modal-content" id="imageModalImg" src="" alt="">
    </div>

    <script>
        // monomdのCSSを挿入
        document.addEventListener('DOMContentLoaded', () => {
            const monomdCssElement = document.getElementById('monomd-css');
            if (monomdCssElement && typeof getMonoMDCSS === 'function') {
                let css = getMonoMDCSS();
                
                // .checklist-content の margin-left のみを置換
                css = css.replace(
                    /(\.monomd-body \.checklist-content\s*{[^}]*margin-left:\s*)([^;]+)(;)/,
                    '$1-22px$3'
                );
                
                // .checklist-content input[type="checkbox"] の margin-top のみを置換
                css = css.replace(
                    /(\.monomd-body \.checklist-content input\[type="checkbox"\]\s*{[^}]*margin-top:\s*)([^;]+)(;)/,
                    '$16px$3'
                );
                
                monomdCssElement.textContent = css;
            }
        });

        const canvas = document.getElementById('canvas');
        const canvasContent = document.getElementById('canvas-content');
        const svg = document.getElementById('svg');
        const addNodeBtn = document.getElementById('addNodeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const importBtn = document.getElementById('importBtn');
        const exportBtn = document.getElementById('exportBtn');
        const fileInput = document.getElementById('fileInput');
        const contextMenu = document.getElementById('contextMenu');
        const exportModal = document.getElementById('exportModal');
        const exportModalCloseBtn = document.getElementById('exportModalCloseBtn');
        const deleteNodeBtn = document.getElementById('deleteNode');
        const deleteConnectionBtn = document.getElementById('deleteConnection');
        const exportTsvBtn = document.getElementById('exportTsvBtn');
        const exportJsonBtn = document.getElementById('exportJsonBtn');
        const helpBtn = document.getElementById('helpBtn');
        const helpBtnMobile = document.getElementById('helpBtnMobile');
        const helpModal = document.getElementById('helpModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        
        // 画像モーダル用
        const imageModal = document.getElementById('imageModal');
        const imageModalImg = document.getElementById('imageModalImg');
        const imageModalCloseBtn = document.getElementById('imageModalCloseBtn');
        
        // ハンバーガーメニュー用
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const hamburgerMenu = document.getElementById('hamburgerMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const addNodeBtnMobile = document.getElementById('addNodeBtnMobile');
        const clearBtnMobile = document.getElementById('clearBtnMobile');
        const importBtnMobile = document.getElementById('importBtnMobile');
        const exportBtnMobile = document.getElementById('exportBtnMobile');

        let nodes = [];
        let connections = [];
        let nodeIdCounter = 0;
        let isDraggingCanvas = false;
        let dragStart = { x: 0, y: 0 };
        let selectedConnection = null;
        let selectedNode = null;
        let connectingFrom = null;
        
        // タッチ操作用の変数
        let touchStartTime = 0;
        let touchMoved = false;
        
        // ズーム用の変数
        let currentScale = 1;
        let lastTouchDistance = 0;

        // UUID生成関数
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // UNIX時間取得
        function getUnixTime() {
            return Math.floor(Date.now() / 1000);
        }

        // 一意のノードID生成
        function generateNodeUniqueId() {
            return `${generateUUID()}_${getUnixTime()}`;
        }

        // ノード作成
        async function createNode(x, y, content = '# 新しいテストケース\n\n内容を記述...') {
            const nodeId = nodeIdCounter++;
            const node = document.createElement('div');
            node.className = 'node';
            node.style.left = x + 'px';
            node.style.top = y + 'px';
            
            node.innerHTML = `
                <div class="resize-handle top"></div>
                <div class="resize-handle bottom"></div>
                <div class="resize-handle left"></div>
                <div class="resize-handle right"></div>
                <div class="connector top" data-direction="top"></div>
                <div class="connector bottom" data-direction="bottom"></div>
                <div class="connector left" data-direction="left"></div>
                <div class="connector right" data-direction="right"></div>
                <div class="node-header">
                    <div class="node-left-section">
                        <select class="test-type type-正常系">
                            <option value="正常系">正常系</option>
                            <option value="異常系">異常系</option>
                            <option value="その他">その他</option>
                        </select>
                        <select class="node-status status-起票">
                            <option value="起票">起票</option>
                            <option value="OK">OK</option>
                            <option value="条件付OK">条件付OK</option>
                            <option value="NG">NG</option>
                            <option value="却下">却下</option>
                            <option value="保留">保留</option>
                        </select>
                    </div>
                    <div class="node-id-container">
                        <div class="node-id" contenteditable="true">TC-${String(nodeId + 1).padStart(3, '0')}</div>
                    </div>
                </div>
                <div class="view-mode">
                    <div class="node-content"></div>
                </div>
                <div class="edit-mode">
                    <textarea class="node-textarea">${content}</textarea>
                </div>
            `;

            const nodeData = {
                id: nodeId,
                uniqueId: generateNodeUniqueId(),
                element: node,
                x: x,
                y: y,
                width: null,
                height: null,
                content: content,
                testCaseId: `TC-${String(nodeId + 1).padStart(3, '0')}`,
                status: '起票',
                testType: '正常系'
            };

            nodes.push(nodeData);
            canvasContent.appendChild(node);

            // マークダウンレンダリング
            await updateNodeContent(nodeData);

            // 初期サイズを記録
            setTimeout(() => {
                if (!nodeData.width) {
                    nodeData.width = node.offsetWidth;
                }
                if (!nodeData.height) {
                    nodeData.height = node.offsetHeight;
                }
            }, 0);

            // イベントリスナー
            setupNodeEvents(nodeData);
            
            // ステータスオプションを更新
            updateStatusOptions(nodeData);

            return nodeData;
        }

        // ノードコンテンツ更新
        async function updateNodeContent(nodeData) {
            const contentDiv = nodeData.element.querySelector('.node-content');
            const result = await renderMarkdown(nodeData.content);
            contentDiv.innerHTML = result.html;
        }

        // ノードの見た目を更新
        function updateNodeAppearance(nodeData) {
            const node = nodeData.element;
            
            // ステータスによるノードクラスの更新
            node.classList.remove('status-起票', 'status-OK', 'status-条件付OK', 'status-NG', 'status-却下', 'status-保留');
            node.classList.add(`status-${nodeData.status}`);
        }

        // 先行ノードのステータスをチェック
        function checkPredecessorStatus(nodeData) {
            // このノードに接続している先行ノード（fromノード）を取得
            const predecessorConnections = connections.filter(conn => conn.to === nodeData.id);
            
            if (predecessorConnections.length === 0) {
                // 先行ノードがない場合は制約なし
                return true;
            }
            
            // すべての先行ノードがOK/条件付OK/却下/保留のいずれかかチェック
            const allPredecessorsOk = predecessorConnections.every(conn => {
                const predecessorNode = nodes.find(n => n.id === conn.from);
                return predecessorNode && (
                    predecessorNode.status === 'OK' || 
                    predecessorNode.status === '条件付OK' ||
                    predecessorNode.status === '却下' ||
                    predecessorNode.status === '保留'
                );
            });
            
            return allPredecessorsOk;
        }

        // ステータスのオプションを更新（制約に基づいて無効化）
        function updateStatusOptions(nodeData) {
            const statusSelect = nodeData.element.querySelector('.node-status');
            const canSetTestResult = checkPredecessorStatus(nodeData);
            
            // オプションを取得
            const options = statusSelect.querySelectorAll('option');
            
            options.forEach(option => {
                const value = option.value;
                
                if (value === 'OK' || value === '条件付OK' || value === 'NG') {
                    if (!canSetTestResult) {
                        option.disabled = true;
                        // 鍵アイコンを追加
                        if (!option.textContent.startsWith('🔒 ')) {
                            option.textContent = '🔒 ' + option.value;
                        }
                    } else {
                        option.disabled = false;
                        // 鍵アイコンを削除
                        option.textContent = option.value;
                    }
                } else {
                    option.disabled = false;
                    option.textContent = option.value;
                }
            });
            
            // 現在のステータスが無効化された場合、起票に戻す
            if (!canSetTestResult && (nodeData.status === 'OK' || nodeData.status === '条件付OK' || nodeData.status === 'NG')) {
                nodeData.status = '起票';
                statusSelect.value = '起票';
                statusSelect.className = 'node-status status-起票';
                updateNodeAppearance(nodeData);
            }
        }

        // すべてのノードのステータスオプションを更新
        function updateAllStatusOptions() {
            nodes.forEach(node => {
                updateStatusOptions(node);
            });
        }

        // ノードイベント設定
        function setupNodeEvents(nodeData) {
            const node = nodeData.element;
            let isDragging = false;
            let dragOffset = { x: 0, y: 0 };

            // テスト種別変更
            const testTypeSelect = node.querySelector('.test-type');
            testTypeSelect.addEventListener('change', (e) => {
                nodeData.testType = e.target.value;
                testTypeSelect.className = `test-type type-${e.target.value}`;
                saveToSessionStorage(); // sessionStorageに保存
            });

            // テストケースID編集
            const nodeIdInput = node.querySelector('.node-id');
            nodeIdInput.addEventListener('blur', () => {
                nodeData.testCaseId = nodeIdInput.textContent;
                saveToSessionStorage(); // sessionStorageに保存
            });

            nodeIdInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nodeIdInput.blur();
                }
            });

            // ステータス変更
            const statusSelect = node.querySelector('.node-status');
            statusSelect.addEventListener('change', (e) => {
                const newStatus = e.target.value;
                
                // 制約チェック
                if ((newStatus === 'OK' || newStatus === '条件付OK' || newStatus === 'NG') && !checkPredecessorStatus(nodeData)) {
                    alert('先行のテストケースがOK/条件付OK/却下/保留のいずれかになっていないため、このステータスは選択できません。');
                    e.target.value = nodeData.status;
                    return;
                }
                
                nodeData.status = newStatus;
                statusSelect.className = `node-status status-${newStatus}`;
                updateNodeAppearance(nodeData);
                
                // このノードのステータスが変更されたら、後続ノードのステータスオプションを更新
                updateAllStatusOptions();
                
                // sessionStorageに保存
                saveToSessionStorage();
            });

            // ドラッグ開始（マウス）
            node.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON' || 
                    e.target.tagName === 'TEXTAREA' || 
                    e.target.tagName === 'SELECT' || 
                    e.target.classList.contains('node-id') ||
                    e.target.classList.contains('connector') ||
                    e.target.classList.contains('resize-handle')) return;
                
                isDragging = true;
                node.classList.add('dragging');
                
                // ドラッグ開始時に現在の幅を固定
                const currentWidth = node.offsetWidth;
                node.style.width = currentWidth + 'px';
                
                dragOffset.x = e.clientX - nodeData.x;
                dragOffset.y = e.clientY - nodeData.y;
                e.stopPropagation();
            });

            // タッチ開始
            node.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON' || 
                    e.target.tagName === 'TEXTAREA' || 
                    e.target.tagName === 'SELECT' || 
                    e.target.classList.contains('node-id') ||
                    e.target.classList.contains('connector') ||
                    e.target.classList.contains('resize-handle')) return;
                
                const touch = e.touches[0];
                touchStartTime = Date.now();
                touchMoved = false;
                
                // タッチ開始位置を記録
                nodeData.touchStartX = touch.clientX;
                nodeData.touchStartY = touch.clientY;
                nodeData.touchStartScrollTop = 0;
                nodeData.isDraggingNode = false;
                nodeData.isScrolling = false;
                
                // node-content内でのタッチかチェック
                const contentDiv = node.querySelector('.node-content');
                nodeData.isTouchOnContent = contentDiv.contains(e.target);
                
                // node-content内のスクロール位置を記録
                if (nodeData.isTouchOnContent) {
                    const monomdBody = contentDiv.querySelector('.monomd-body');
                    if (monomdBody) {
                        nodeData.touchStartScrollTop = monomdBody.scrollTop || 0;
                    }
                }
                
                dragOffset.x = touch.clientX - nodeData.x;
                dragOffset.y = touch.clientY - nodeData.y;
            }, { passive: false });

            // タッチ移動
            node.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const deltaX = Math.abs(touch.clientX - nodeData.touchStartX);
                const deltaY = Math.abs(touch.clientY - nodeData.touchStartY);
                
                // まだ方向が確定していない場合
                if (!nodeData.isDraggingNode && !nodeData.isScrolling) {
                    // 5px以上動いたら方向を判定
                    if (deltaX > 5 || deltaY > 5) {
                        if (nodeData.isTouchOnContent && deltaY > deltaX * 1.5) {
                            // node-content内で縦方向の動きが大きい場合はスクロール
                            nodeData.isScrolling = true;
                        } else {
                            // それ以外はドラッグ
                            nodeData.isDraggingNode = true;
                            isDragging = true;
                            node.classList.add('dragging');
                            
                            // ドラッグ開始時に現在の幅を固定
                            const currentWidth = node.offsetWidth;
                            node.style.width = currentWidth + 'px';
                        }
                    }
                }
                
                // ドラッグ中
                if (nodeData.isDraggingNode && isDragging) {
                    touchMoved = true;
                    nodeData.x = touch.clientX - dragOffset.x;
                    nodeData.y = touch.clientY - dragOffset.y;
                    node.style.left = nodeData.x + 'px';
                    node.style.top = nodeData.y + 'px';
                    updateConnections();
                    e.preventDefault();
                    e.stopPropagation();
                }
                // スクロール中はデフォルト動作を許可（preventDefault しない）
            }, { passive: false });

            // タッチ終了
            node.addEventListener('touchend', (e) => {
                if (isDragging) {
                    isDragging = false;
                    node.classList.remove('dragging');
                    
                    // ダブルタップ判定（編集モード用）
                    const touchDuration = Date.now() - touchStartTime;
                    if (!touchMoved && touchDuration < 300) {
                        // シングルタップの処理はここには書かない
                    }
                }
                
                // フラグをリセット
                nodeData.isDraggingNode = false;
                nodeData.isScrolling = false;
            });

            // マークダウン部分のダブルクリックで編集モードに
            const contentDiv = node.querySelector('.node-content');
            contentDiv.addEventListener('dblclick', () => {
                // 現在のノードのサイズを取得して固定
                const currentWidth = node.offsetWidth;
                const currentHeight = node.offsetHeight;
                
                // ノードのサイズを明示的に設定
                if (!nodeData.width || nodeData.width < currentWidth) {
                    nodeData.width = currentWidth;
                }
                if (!nodeData.height || nodeData.height < currentHeight) {
                    nodeData.height = currentHeight;
                }
                
                node.style.width = nodeData.width + 'px';
                node.style.height = nodeData.height + 'px';
                
                node.classList.add('editing');
                const textarea = node.querySelector('.node-textarea');
                textarea.focus();
            });

            // テキストエリア外クリックで保存
            const textarea = node.querySelector('.node-textarea');
            document.addEventListener('click', (e) => {
                if (node.classList.contains('editing')) {
                    // テキストエリアとその親要素以外をクリックした場合
                    if (!textarea.contains(e.target) && !node.contains(e.target)) {
                        nodeData.content = textarea.value;
                        updateNodeContent(nodeData);
                        node.classList.remove('editing');
                        saveToSessionStorage(); // sessionStorageに保存
                    } else if (node.contains(e.target) && !textarea.contains(e.target) && e.target.tagName !== 'TEXTAREA') {
                        // ノード内のテキストエリア以外をクリックした場合
                        nodeData.content = textarea.value;
                        updateNodeContent(nodeData);
                        node.classList.remove('editing');
                        saveToSessionStorage(); // sessionStorageに保存
                    }
                }
            });

            // リサイズハンドルのイベント
            const resizeHandles = node.querySelectorAll('.resize-handle');
            resizeHandles.forEach(handle => {
                let isResizing = false;
                let resizeStartX = 0;
                let resizeStartY = 0;
                let startWidth = 0;
                let startHeight = 0;
                let startX = 0;
                let startY = 0;

                // マウスダウン
                handle.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    isResizing = true;
                    resizeStartX = e.clientX;
                    resizeStartY = e.clientY;
                    startWidth = node.offsetWidth;
                    startHeight = node.offsetHeight;
                    startX = nodeData.x;
                    startY = nodeData.y;
                    node.classList.add('resizing');

                    const handleMouseMove = (e) => {
                        if (!isResizing) return;

                        const deltaX = e.clientX - resizeStartX;
                        const deltaY = e.clientY - resizeStartY;

                        if (handle.classList.contains('right')) {
                            const newWidth = Math.max(200, startWidth + deltaX);
                            node.style.width = newWidth + 'px';
                            nodeData.width = newWidth;
                        } else if (handle.classList.contains('left')) {
                            const newWidth = Math.max(200, startWidth - deltaX);
                            if (newWidth > 200) {
                                node.style.width = newWidth + 'px';
                                nodeData.width = newWidth;
                                nodeData.x = startX + deltaX;
                                node.style.left = nodeData.x + 'px';
                            }
                        } else if (handle.classList.contains('bottom')) {
                            const newHeight = Math.max(100, startHeight + deltaY);
                            node.style.height = newHeight + 'px';
                            nodeData.height = newHeight;
                        } else if (handle.classList.contains('top')) {
                            const newHeight = Math.max(100, startHeight - deltaY);
                            if (newHeight > 100) {
                                node.style.height = newHeight + 'px';
                                nodeData.height = newHeight;
                                nodeData.y = startY + deltaY;
                                node.style.top = nodeData.y + 'px';
                            }
                        }

                        updateConnections();
                    };

                    const handleMouseUp = () => {
                        if (isResizing) {
                            isResizing = false;
                            node.classList.remove('resizing');
                            document.removeEventListener('mousemove', handleMouseMove);
                            document.removeEventListener('mouseup', handleMouseUp);
                        }
                    };

                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                });

                // タッチ開始
                handle.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    const touch = e.touches[0];
                    isResizing = true;
                    resizeStartX = touch.clientX;
                    resizeStartY = touch.clientY;
                    startWidth = node.offsetWidth;
                    startHeight = node.offsetHeight;
                    startX = nodeData.x;
                    startY = nodeData.y;
                    node.classList.add('resizing');
                }, { passive: false });

                // タッチ移動
                handle.addEventListener('touchmove', (e) => {
                    if (!isResizing) return;
                    
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - resizeStartX;
                    const deltaY = touch.clientY - resizeStartY;

                    if (handle.classList.contains('right')) {
                        const newWidth = Math.max(200, startWidth + deltaX);
                        node.style.width = newWidth + 'px';
                        nodeData.width = newWidth;
                    } else if (handle.classList.contains('left')) {
                        const newWidth = Math.max(200, startWidth - deltaX);
                        if (newWidth > 200) {
                            node.style.width = newWidth + 'px';
                            nodeData.width = newWidth;
                            nodeData.x = startX + deltaX;
                            node.style.left = nodeData.x + 'px';
                        }
                    } else if (handle.classList.contains('bottom')) {
                        const newHeight = Math.max(100, startHeight + deltaY);
                        node.style.height = newHeight + 'px';
                        nodeData.height = newHeight;
                    } else if (handle.classList.contains('top')) {
                        const newHeight = Math.max(100, startHeight - deltaY);
                        if (newHeight > 100) {
                            node.style.height = newHeight + 'px';
                            nodeData.height = newHeight;
                            nodeData.y = startY + deltaY;
                            node.style.top = nodeData.y + 'px';
                        }
                    }

                    updateConnections();
                    e.preventDefault();
                }, { passive: false });

                // タッチ終了
                handle.addEventListener('touchend', () => {
                    if (isResizing) {
                        isResizing = false;
                        node.classList.remove('resizing');
                    }
                });
            });

            // ノードの右クリックメニュー
            node.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                selectedNode = nodeData;
                selectedConnection = null;
                contextMenu.style.left = e.clientX + 'px';
                contextMenu.style.top = e.clientY + 'px';
                contextMenu.classList.add('show');
                
                // メニュー項目の表示/非表示
                deleteNodeBtn.style.display = 'block';
                deleteConnectionBtn.style.display = 'none';
            });

            // コネクターのクリックイベント
            const connectors = node.querySelectorAll('.connector');
            connectors.forEach(connector => {
                connector.addEventListener('click', (e) => {
                    e.stopPropagation();
                    handleConnectorClick(nodeData, connector);
                });
            });

            // マウス移動
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    nodeData.x = e.clientX - dragOffset.x;
                    nodeData.y = e.clientY - dragOffset.y;
                    node.style.left = nodeData.x + 'px';
                    node.style.top = nodeData.y + 'px';
                    updateConnections();
                }
            });

            // ドラッグ終了
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    node.classList.remove('dragging');
                }
            });

            // ノード内の画像クリックで拡大表示
            node.addEventListener('click', (e) => {
                if (e.target.tagName === 'IMG' && e.target.closest('.node-content')) {
                    e.stopPropagation();
                    imageModalImg.src = e.target.src;
                    imageModalImg.alt = e.target.alt;
                    imageModal.classList.add('show');
                }
            });
        }

        // ノード削除
        function deleteNode(nodeData) {
            nodeData.element.remove();
            nodes = nodes.filter(n => n.id !== nodeData.id);
            connections = connections.filter(c => c.from !== nodeData.id && c.to !== nodeData.id);
            updateConnections();
        }

        // 接続作成
        function createConnection(fromNodeId, toNodeId, fromDirection, toDirection) {
            connections.push({ 
                from: fromNodeId, 
                to: toNodeId,
                fromDirection: fromDirection || 'center',
                toDirection: toDirection || 'center'
            });
            updateConnections();
            
            // 接続が作成されたら、すべてのノードのステータスオプションを更新
            updateAllStatusOptions();
        }

        // コネクタークリック処理
        function handleConnectorClick(nodeData, connector) {
            const direction = connector.dataset.direction;
            
            if (!connectingFrom) {
                // 接続開始
                connectingFrom = {
                    node: nodeData,
                    direction: direction,
                    connector: connector
                };
                connector.classList.add('active');
            } else {
                // 接続完了
                if (connectingFrom.node.id !== nodeData.id) {
                    createConnection(
                        connectingFrom.node.id, 
                        nodeData.id,
                        connectingFrom.direction,
                        direction
                    );
                }
                // アクティブ状態を解除
                const activeConnectors = document.querySelectorAll('.connector.active');
                activeConnectors.forEach(c => c.classList.remove('active'));
                connectingFrom = null;
            }
        }

        // TSVエスケープ関数（バックスラッシュでエスケープ）
        function escapeTsv(value) {
            if (value == null) return '';
            const stringValue = String(value);
            // バックスラッシュ、タブ、改行、キャリッジリターンをエスケープ
            return stringValue
                .replace(/\\/g, '\\\\')  // バックスラッシュ
                .replace(/\t/g, '\\t')   // タブ
                .replace(/\n/g, '\\n')   // 改行
                .replace(/\r/g, '\\r');  // キャリッジリターン
        }

        // TSV形式でエクスポート
        function exportToTsv() {
            // テストケースIDの重複チェック
            const duplicates = checkDuplicateTestCaseIds();
            if (duplicates.length > 0) {
                alert('重複のテストケースIDがあります。一意の値を登録してください。\n重複ID: ' + duplicates.join(', '));
                return;
            }

            // ヘッダー行（英語）
            const headers = [
                'unique_id',
                'test_case_id',
                'test_type',
                'status',
                'markdown_content',
                'height',
                'width',
                'x_position',
                'y_position',
                'connected_node_ids'
            ];

            let tsvContent = headers.join('\t') + '\n';

            // データ行
            nodes.forEach(node => {
                // 接続先のノードIDリストを取得（方向情報付き）
                const connectedToNodeIds = connections
                    .filter(conn => conn.from === node.id)
                    .map(conn => {
                        const targetNode = nodes.find(n => n.id === conn.to);
                        return targetNode ? {
                            direction: 'to',
                            node_id: targetNode.uniqueId,
                            connect_point: conn.fromDirection || 'center'
                        } : null;
                    })
                    .filter(conn => conn !== null);

                // 接続元のノードIDリストも取得
                const connectedFromNodeIds = connections
                    .filter(conn => conn.to === node.id)
                    .map(conn => {
                        const sourceNode = nodes.find(n => n.id === conn.from);
                        return sourceNode ? {
                            direction: 'from',
                            node_id: sourceNode.uniqueId,
                            connect_point: conn.toDirection || 'center'
                        } : null;
                    })
                    .filter(conn => conn !== null);

                // 両方を結合してJSON文字列化
                const allConnections = [...connectedToNodeIds, ...connectedFromNodeIds];
                const connectionsJson = JSON.stringify(allConnections);

                const row = [
                    escapeTsv(node.uniqueId),
                    escapeTsv(node.testCaseId.trim()),
                    escapeTsv(node.testType),
                    escapeTsv(node.status),
                    escapeTsv(node.content),
                    escapeTsv(node.height || node.element.offsetHeight),
                    escapeTsv(node.width || node.element.offsetWidth),
                    escapeTsv(node.x),
                    escapeTsv(node.y),
                    escapeTsv(connectionsJson)
                ];

                tsvContent += row.join('\t') + '\n';
            });

            // ダウンロード
            const blob = new Blob([tsvContent], { type: 'text/tab-separated-values;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
            link.setAttribute('href', url);
            link.setAttribute('download', `test_mindmap_${timestamp}.tsv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // JSON形式でエクスポート
        // JSONデータを生成
        function generateJsonData() {
            const exportData = {
                export_date: new Date().toISOString(),
                version: '1.0',
                nodes: nodes.map(node => {
                    // 接続先のノードIDリストを取得（方向情報付き）
                    const connectedToNodeIds = connections
                        .filter(conn => conn.from === node.id)
                        .map(conn => {
                            const targetNode = nodes.find(n => n.id === conn.to);
                            return targetNode ? {
                                direction: 'to',
                                node_id: targetNode.uniqueId,
                                connect_point: conn.fromDirection || 'center'
                            } : null;
                        })
                        .filter(conn => conn !== null);

                    // 接続元のノードIDリストも取得
                    const connectedFromNodeIds = connections
                        .filter(conn => conn.to === node.id)
                        .map(conn => {
                            const sourceNode = nodes.find(n => n.id === conn.from);
                            return sourceNode ? {
                                direction: 'from',
                                node_id: sourceNode.uniqueId,
                                connect_point: conn.toDirection || 'center'
                            } : null;
                        })
                        .filter(conn => conn !== null);

                    // 両方を結合
                    const allConnections = [...connectedToNodeIds, ...connectedFromNodeIds];

                    return {
                        unique_id: node.uniqueId,
                        test_case_id: node.testCaseId.trim(),
                        test_type: node.testType,
                        status: node.status,
                        markdown_content: node.content,
                        height: node.height || node.element.offsetHeight,
                        width: node.width || node.element.offsetWidth,
                        x_position: node.x,
                        y_position: node.y,
                        connected_node_ids: allConnections
                    };
                })
            };
            return exportData;
        }

        // SVG形式でエクスポート

        // テストケースIDの重複チェック
        function checkDuplicateTestCaseIds() {
            const testCaseIds = nodes.map(node => node.testCaseId.trim());
            const uniqueIds = new Set();
            const duplicates = [];

            testCaseIds.forEach(id => {
                if (uniqueIds.has(id)) {
                    if (!duplicates.includes(id)) {
                        duplicates.push(id);
                    }
                } else {
                    uniqueIds.add(id);
                }
            });

            return duplicates;
        }

        // TSVパース関数（バックスラッシュエスケープに対応）
        function parseTsv(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            
            return lines.map(line => {
                const fields = [];
                let currentField = '';
                let i = 0;
                
                while (i < line.length) {
                    const char = line[i];
                    
                    if (char === '\\' && i + 1 < line.length) {
                        // エスケープシーケンス処理
                        const nextChar = line[i + 1];
                        if (nextChar === '\\') {
                            currentField += '\\';
                        } else if (nextChar === 't') {
                            currentField += '\t';
                        } else if (nextChar === 'n') {
                            currentField += '\n';
                        } else if (nextChar === 'r') {
                            currentField += '\r';
                        } else {
                            currentField += nextChar;
                        }
                        i += 2;
                    } else if (char === '\t') {
                        // タブでフィールド区切り
                        fields.push(currentField);
                        currentField = '';
                        i++;
                    } else {
                        currentField += char;
                        i++;
                    }
                }
                
                // 最後のフィールドを追加
                fields.push(currentField);
                
                return fields;
            });
        }

        // インポート関数
        // JSONデータからインポート
        async function importFromJsonData(jsonData) {
            const importData = jsonData.nodes || [];
            
            // 既存のノードと接続をクリア
            nodes.forEach(n => n.element.remove());
            nodes = [];
            connections = [];
            nodeIdCounter = 0;
            
            // uniqueIdからnodeIdへのマッピング
            const uniqueIdToNodeId = new Map();
            
            // ノードを再作成
            for (const nodeInfo of importData) {
                const x = parseFloat(nodeInfo.x_position) || Math.random() * 600 + 100;
                const y = parseFloat(nodeInfo.y_position) || Math.random() * 400 + 100;
                const content = nodeInfo.markdown_content || '';
                
                const newNode = await createNode(x, y, content);
                
                // ノードデータを復元
                newNode.uniqueId = nodeInfo.unique_id;
                newNode.testCaseId = nodeInfo.test_case_id;
                newNode.testType = nodeInfo.test_type || '正常系';
                newNode.status = nodeInfo.status || '起票';
                newNode.width = parseFloat(nodeInfo.width) || null;
                newNode.height = parseFloat(nodeInfo.height) || null;
                
                // サイズを設定
                if (newNode.width) {
                    newNode.element.style.width = newNode.width + 'px';
                }
                if (newNode.height) {
                    newNode.element.style.height = newNode.height + 'px';
                }
                
                // UIを更新
                const nodeIdInput = newNode.element.querySelector('.node-id');
                nodeIdInput.textContent = newNode.testCaseId;
                
                const testTypeSelect = newNode.element.querySelector('.test-type');
                testTypeSelect.value = newNode.testType;
                testTypeSelect.className = `test-type type-${newNode.testType}`;
                
                const statusSelect = newNode.element.querySelector('.node-status');
                statusSelect.value = newNode.status;
                statusSelect.className = `node-status status-${newNode.status}`;
                updateNodeAppearance(newNode);
                
                // マッピングを保存
                uniqueIdToNodeId.set(nodeInfo.unique_id, newNode.id);
            }
            
            // 接続を再作成
            importData.forEach(nodeInfo => {
                const currentNode = nodes.find(n => n.uniqueId === nodeInfo.unique_id);
                if (!currentNode) return;
                
                // connected_node_idsを配列として取得（文字列の場合はパース）
                let connectedNodeIds = nodeInfo.connected_node_ids || [];
                if (typeof connectedNodeIds === 'string') {
                    try {
                        connectedNodeIds = JSON.parse(connectedNodeIds);
                    } catch (e) {
                        console.error('Failed to parse connected_node_ids:', e);
                        connectedNodeIds = [];
                    }
                }
                
                connectedNodeIds.forEach(connInfo => {
                    if (connInfo.direction === 'to') {
                        const targetNodeId = uniqueIdToNodeId.get(connInfo.node_id);
                        if (targetNodeId) {
                            const fromDirection = connInfo.connect_point || 'center';
                            
                            // 接続先ノードのデータから接続点を取得
                            const targetNodeInfo = importData.find(n => n.unique_id === connInfo.node_id);
                            let toDirection = 'center';
                            
                            if (targetNodeInfo) {
                                let targetConnections = targetNodeInfo.connected_node_ids || [];
                                if (typeof targetConnections === 'string') {
                                    try {
                                        targetConnections = JSON.parse(targetConnections);
                                    } catch (e) {
                                        targetConnections = [];
                                    }
                                }
                                
                                // 相手ノードから自分へのfrom接続を探す
                                const reverseConn = targetConnections.find(
                                    c => c.direction === 'from' && c.node_id === nodeInfo.unique_id
                                );
                                if (reverseConn) {
                                    toDirection = reverseConn.connect_point || 'center';
                                }
                            }
                            
                            createConnection(currentNode.id, targetNodeId, fromDirection, toDirection);
                        }
                    }
                });
            });
            
            updateAllStatusOptions();
        }

        function importFromFile(file) {
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const content = e.target.result;
                const fileName = file.name.toLowerCase();
                
                try {
                    if (fileName.endsWith('.json')) {
                        // JSON形式のインポート
                        const jsonData = JSON.parse(content);
                        await importFromJsonData(jsonData);
                    } else if (fileName.endsWith('.tsv')) {
                        // TSV形式のインポート
                        const tsvLines = parseTsv(content);
                        const headers = tsvLines[0];
                        const importData = tsvLines.slice(1).map(row => {
                            const obj = {};
                            headers.forEach((header, index) => {
                                obj[header] = row[index] || '';
                            });
                            return obj;
                        });
                        
                        // TSVデータをJSON形式に変換してimport
                        await importFromJsonData({ nodes: importData });
                    } else {
                        alert('サポートされていないファイル形式です。TSVまたはJSONファイルを選択してください。');
                        return;
                    }
                    
                    alert('インポートが完了しました。');
                    
                } catch (error) {
                    console.error('Import error:', error);
                    alert('ファイルの読み込みに失敗しました。ファイル形式を確認してください。\nエラー: ' + error.message);
                }
            };
            
            reader.readAsText(file);
        }

        // 接続更新
        function updateConnections() {
            svg.innerHTML = '<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="white" /></marker></defs>';
            
            connections.forEach((conn, index) => {

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    
                    // コネクターの位置を計算

                    line.setAttribute('x1', fromPos.x);

        // コネクターの位置を取得
        function getConnectorPosition(nodeData, direction) {
            const rect = nodeData.element.getBoundingClientRect();
            const nodeWidth = nodeData.width || rect.width;
            const nodeHeight = nodeData.height || rect.height;
            
            let x, y;
            
            switch(direction) {
                case 'top':
                    x = nodeData.x + nodeWidth / 2;
                    y = nodeData.y;
                    break;
                case 'bottom':
                    x = nodeData.x + nodeWidth / 2;
                    y = nodeData.y + nodeHeight;
                    break;
                case 'left':
                    x = nodeData.x;
                    y = nodeData.y + nodeHeight / 2;
                    break;
                case 'right':
                    x = nodeData.x + nodeWidth;
                    y = nodeData.y + nodeHeight / 2;
                    break;
                default: // center
                    x = nodeData.x + nodeWidth / 2;
                    y = nodeData.y + nodeHeight / 2;
                    break;
            }
            
            return { x, y };
        }

                lastTouchDistance = Math.hypot(

                    touch2.clientY - touch1.clientY
                );
            } else if (e.touches.length === 1 && (e.target === canvas || e.target === canvasContent || e.target === svg)) {
                // 1本指でのタッチ - キャンバス移動
                const touch = e.touches[0];

                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const currentDistance = Math.hypot(
                    touch2.clientX - touch1.clientX,
                    touch2.clientY - touch1.clientY
                );
                
                if (lastTouchDistance > 0) {
                    const scale = currentDistance / lastTouchDistance;
                    currentScale *= scale;
                    
                    // スケールの制限（0.5倍〜3倍）
                    currentScale = Math.max(0.5, Math.min(3, currentScale));
                    
                    // canvas-contentにスケールを適用（canvasのサイズは維持）
                    canvasContent.style.transform = `scale(${currentScale})`;
                    
                    // スケールをsessionStorageに保存
                    try {
                        sessionStorage.setItem('mindmap_scale', currentScale.toString());
                    } catch (e) {
                        console.error('スケールの保存に失敗:', e);
                    }
                }
                
                lastTouchDistance = currentDistance;
                e.preventDefault();
            } else if (isDraggingCanvas && e.touches.length === 1) {
                // 1本指でのキャンバス移動
                const touch = e.touches[0];
                const dx = touch.clientX - dragStart.x;
                const dy = touch.clientY - dragStart.y;
                
                nodes.forEach(nodeData => {
                    nodeData.x += dx;
                    nodeData.y += dy;
                    nodeData.element.style.left = nodeData.x + 'px';
                    nodeData.element.style.top = nodeData.y + 'px';
                });
                
                updateConnections();
                dragStart.x = touch.clientX;
                dragStart.y = touch.clientY;
                e.preventDefault();
            }
        }, { passive: false });

        // マウスアップ
        document.addEventListener('mouseup', () => {
            if (isDraggingCanvas) {
                // 全ノードのdraggingクラスを削除
                nodes.forEach(nodeData => {
                    nodeData.element.classList.remove('dragging');
                });
            }
            isDraggingCanvas = false;
            canvas.classList.remove('grabbing');
        });

        // タッチ終了
        document.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                lastTouchDistance = 0;
            }
            if (e.touches.length === 0) {
                if (isDraggingCanvas) {
                    // 全ノードのdraggingクラスを削除
                    nodes.forEach(nodeData => {
                        nodeData.element.classList.remove('dragging');
                    });
                }
                isDraggingCanvas = false;
                canvas.classList.remove('grabbing');
            }
        });

        // ハンバーガーメニューの開閉
        hamburgerBtn.addEventListener('click', () => {
            const isOpen = hamburgerMenu.classList.contains('open');
            
            if (isOpen) {
                // メニューを閉じる
                hamburgerMenu.classList.remove('open');
                menuOverlay.classList.remove('show');
                hamburgerBtn.innerHTML = '<i class="fas fa-bars"></i> メニュー';
            } else {
                // メニューを開く
                hamburgerMenu.classList.add('open');
                menuOverlay.classList.add('show');
                hamburgerBtn.innerHTML = '<i class="fas fa-xmark"></i> 閉じる';
            }
        });

        menuOverlay.addEventListener('click', () => {
            hamburgerMenu.classList.remove('open');
            menuOverlay.classList.remove('show');
            hamburgerBtn.innerHTML = '<i class="fas fa-bars"></i> メニュー';
        });

        // モバイルメニューのボタンイベント
        addNodeBtnMobile.addEventListener('click', async () => {
            await createNode(Math.random() * 600 + 100, Math.random() * 400 + 100);
            hamburgerMenu.classList.remove('open');
            menuOverlay.classList.remove('show');
            hamburgerBtn.innerHTML = '<i class="fas fa-bars"></i> メニュー';
        });

        clearBtnMobile.addEventListener('click', () => {
            if (confirm('本当に削除しますか？')) {
                nodes.forEach(n => n.element.remove());
                nodes = [];
                connections = [];
                updateConnections();
            }
            hamburgerMenu.classList.remove('open');
            menuOverlay.classList.remove('show');
            hamburgerBtn.innerHTML = '<i class="fas fa-bars"></i> メニュー';
        });

        importBtnMobile.addEventListener('click', () => {
            fileInput.click();
            hamburgerMenu.classList.remove('open');
            menuOverlay.classList.remove('show');
            hamburgerBtn.innerHTML = '<i class="fas fa-bars"></i> メニュー';
        });

        exportBtnMobile.addEventListener('click', () => {
            exportModal.classList.add('show');
            hamburgerMenu.classList.remove('open');
            menuOverlay.classList.remove('show');
            hamburgerBtn.innerHTML = '<i class="fas fa-bars"></i> メニュー';
        });

        // ページロード時にsessionStorageから復元
        (async () => {
            // ズームスケールの復元
            try {
                const savedScale = sessionStorage.getItem('mindmap_scale');
                if (savedScale) {
                    currentScale = parseFloat(savedScale);
                    // スケールの制限（0.5倍〜3倍）
                    currentScale = Math.max(0.5, Math.min(3, currentScale));
                    canvasContent.style.transform = `scale(${currentScale})`;
                }
            } catch (e) {
                console.error('スケールの復元に失敗:', e);
            }
            
            const loadedFromStorage = await loadFromSessionStorage();
            
            // sessionStorageにデータがない場合のみ、初期ノード作成（デモ用）
            if (!loadedFromStorage) {
                const node1 = await createNode(200, 150, '# ログイン機能テスト\n\n## 前提条件\n- ユーザーが登録済み\n- ログイン画面が表示されている\n\n## テスト手順\n1. ユーザーIDを入力\n2. パスワードを入力\n3. ログインボタンをクリック\n\n## 期待結果\nホーム画面が表示される');
                const node2 = await createNode(550, 100, '# 正常系テスト\n\n## 手順\n- 有効なID/PWを入力\n\n## 結果\n**成功**してログインできる');
                const node3 = await createNode(550, 300, '# 異常系テスト\n\n## 手順\n- 無効なPWを入力\n\n## 結果\n`エラーメッセージ`が表示される');
                
                // 初期ノードのテスト種別を設定
                node2.testType = '正常系';
                node2.element.querySelector('.test-type').value = '正常系';
                node2.element.querySelector('.test-type').className = 'test-type type-正常系';
                
                node3.testType = '異常系';
                node3.element.querySelector('.test-type').value = '異常系';
                node3.element.querySelector('.test-type').className = 'test-type type-異常系';
                
                createConnection(node1.id, node2.id, 'right', 'left');
                createConnection(node1.id, node3.id, 'right', 'left');
            }
        })();
    </script>
</body>
</html>
