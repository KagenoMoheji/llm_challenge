[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capass-server"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "psycopg[binary]",
  "cryptography",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
capass-server = "capass_server.main:run"

[tool.setuptools.packages.find]
include = ["capass_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ut=unit test, it=integration test, st=system test, uat=user acceptance test
python_files = ["ut_*.py", "it_*.py", "st_*.py", "uat_*.py"]

[tool.setuptools.dynamic]
version = {attr = "capass_server.__version__"}