[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capass-agent"
dynamic = ["version"]
requires-python = ">=3.10"
# AIエージェントのモード。cli/ だけを持つ(待ち受けの機能は、持たない)
# 共通部品とcapassコマンド(capass)に、依存する。バージョンは、同じ値に固定する(上げるときは、そろえる)。
dependencies = [
  "capass==0.1.6",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["capass_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ut=unit test, it=integration test, st=system test, uat=user acceptance test
python_files = ["ut_*.py", "it_*.py", "st_*.py", "uat_*.py"]

[tool.setuptools.dynamic]
version = {attr = "capass_agent.__version__"}
