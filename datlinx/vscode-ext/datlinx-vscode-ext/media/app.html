<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} https: data:; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'unsafe-inline'; font-src {{cspSource}};">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>datlinx - SQL Lineage Mindmap</title>
    <link rel="stylesheet" href="{{appCssUri}}">
</head>
<body>

    <!-- 上部ツールバー -->
    <header id="toolbar">
        <div class="brand-section">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="3"/><circle cx="19" cy="6" r="3"/><circle cx="19" cy="18" r="3"/><path d="M8 12h3m0 0l5-6m-5 6l5 6"/></svg>
                <span>datlinx</span>
            </div>
            <span class="brand-badge" id="folder-name-badge">Loading...</span>
            <div class="info-pill" id="stats-pill">
                0 ノード / 0 依存関係
            </div>
        </div>

        <!-- 3色カラー凡例 -->
        <div class="legend-bar">
            <span class="legend-item"><span class="legend-dot dot-upstream"></span> 依存元 (薄緑/緑線)</span>
            <span class="legend-item"><span class="legend-dot dot-selected"></span> 選択要素 (薄橙)</span>
            <span class="legend-item"><span class="legend-dot dot-downstream"></span> 依存先 (薄赤/赤線)</span>
        </div>

        <div class="tool-group">
            <!-- フォルダ選択（VS Codeダイアログ起動） -->
            <button class="btn btn-primary" id="btn-select-folder" title="別のSQLフォルダを開く">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                <span>フォルダ選択</span>
            </button>

            <!-- リロード -->
            <button class="btn" id="btn-reload" title="SQLファイルを再スキャン">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                <span>再スキャン</span>
            </button>

            <!-- [3] 検索フォーム -->
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <input type="text" id="search-input" class="search-input" placeholder="テーブル/プロシージャ/ビューを検索...">
                <span class="search-clear" id="search-clear">&times;</span>
                <span class="search-count" id="search-count"></span>
            </div>

            <!-- 自動再整列 -->
            <button class="btn" id="btn-auto-layout" title="マインドマップを綺麗に再整列">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="9" y="15" width="6" height="6" rx="1"/><path d="M6 9v3a3 3 0 0 0 3 3h3m6-6v3a3 3 0 0 1-3 3h-3"/></svg>
                <span>再整列</span>
            </button>

            <!-- サイドバー表示切替 -->
            <button class="btn" id="btn-toggle-sidebar" title="SQLファイル一覧の表示切替">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main id="main-container">
        <!-- キャンバス -->
        <div id="canvas-wrapper">
            <div id="canvas">
                <svg id="svg-layer">
                    <defs>
                        <!-- 通常の矢印マーカー -->
                        <marker id="arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
                        </marker>
                        <!-- [4] 依存元の緑色矢印マーカー -->
                        <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#22c55e" />
                        </marker>
                        <!-- [4] 依存先の赤色矢印マーカー -->
                        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#ef4444" />
                        </marker>
                    </defs>
                </svg>
                <div id="nodes-layer"></div>
            </div>

            <!-- 空状態案内 -->
            <div id="empty-state" class="hidden">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#60a5fa" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </div>
                <h2 class="empty-title">SQLファイルが見つかりません</h2>
                <p class="empty-desc">
                    <code>CREATE PROCEDURE</code> / <code>CREATE FUNCTION</code> / <code>CREATE VIEW</code> のDDLが書かれたSQLファイルを含むフォルダを開いてください。
                </p>
                <button class="btn btn-primary" onclick="requestSelectFolder()">
                    <span>フォルダを選択</span>
                </button>
            </div>

            <!-- ズーム/パン コントローラー -->
            <div class="controls-overlay" id="controls-overlay">
                <button class="control-btn" id="btn-zoom-in" title="ズームイン">＋</button>
                <button class="control-btn" id="btn-zoom-out" title="ズームアウト">−</button>
                <button class="control-btn" id="btn-zoom-reset" title="全体表示 (フィット)">⛶</button>
                <button class="control-btn" id="btn-clear-selection" title="選択ハイライト解除">↺</button>
            </div>
        </div>

        <!-- サイドバー（ファイル一覧） -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <span>解析済みSQLファイル</span>
                <span id="file-count-badge" class="badge badge-table">0 件</span>
            </div>
            <div class="sidebar-content" id="sidebar-files">
                <!-- 動的に生成 -->
            </div>
        </aside>
    </main>

    <!-- SQL内容表示モーダル -->
    <div id="sql-modal" class="hidden">
        <div class="modal-card">
            <div class="modal-header">
                <span id="modal-title" style="font-weight:700; font-size:15px;">SQL詳細</span>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-primary" id="btn-modal-open-editor" title="VS Codeエディタで開く">VS Codeで開く</button>
                    <button class="btn" id="btn-close-modal">&times;</button>
                </div>
            </div>
            <pre class="modal-body" id="modal-content"></pre>
        </div>
    </div>

    <!-- UIスクリプト -->
    <script src="{{appJsUri}}"></script>
</body>
</html>
