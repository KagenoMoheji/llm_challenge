<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#818cf8" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- 背景角丸スクエア -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- 接続線 -->
  <path d="M 16 32 C 26 32, 26 20, 36 20" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 16 32 C 26 32, 26 44, 36 44" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 36 20 C 44 20, 44 28, 50 28" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 36 44 C 44 44, 44 36, 50 36" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ノード -->
  <!-- 左：依存元ノード (緑) -->
  <circle cx="16" cy="32" r="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#glow)"/>
  
  <!-- 中央：選択ノード (橙) -->
  <circle cx="36" cy="20" r="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="36" cy="44" r="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>

  <!-- 右：依存先ノード (赤) -->
  <circle cx="50" cy="28" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#glow)"/>
  <circle cx="50" cy="36" r="4" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
</svg>
