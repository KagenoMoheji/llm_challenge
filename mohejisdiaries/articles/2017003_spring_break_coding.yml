content:
  - headline: 春休みに突入！
    body: |
      どうも！同志社大学では、テストは2/16まで（早い人は1月中に終わる人も・・・！）でして、私自身、2/14に終わったので、そこから春休みに突入しています(*´▽｀*)  
      春休みだ～ぐうたらできる～！！・・・・・・ではなくてですね！本題に入りましょう！
  - headline: 春休みのプログラミング学習
    body: |
      春休みに進める学習は、主に３つあります。
      
      __①Python基礎学習__  
      １つ目のPythonですが、これは大学の講義でもやらないので、独学という形で進めていこうと思っていました。特に春休みや夏休みという大型連休を利用して。応用する場面はまだ思いついていないのですが、広く言語に触れられるように、まずは基礎を身につけていきたいと思います。
      
      __②JavaScript基礎学習__  
      ２つ目のJavaScriptは、このサイトを改良するうえで必要になってきたため、基礎から身につけてから、改良に努めたいと思います。例えば、メールフォームの作成や、タグ移動、効率化（課題のほぼ全部やんけ）にも使う予定です。
      
      __③HTML/CSS学習__  
      ３つ目は、これまでのこのサイトの制作もその一環として学習してきました。  
      「スラスラわかるHTML＆CSSのきほん」や、「いきなりできます！最新ホームページ作り＆HTML超入門第３版」という本を用いて基礎を学び、そこから自分流に分かる書き方でこのサイトを構築しました（本の書き方そのままでやると、かなり複雑になってしまい、整理がつかなかったんです・・・(´･ω･｀)）。
  - headline: 最後に一言
    body: |
      春休みも、残り一か月強。この３つの言語を使いこなせるように、有意義に学習して過ごしていきたいと思います。~~（なんか引きこもりになりそう）~~