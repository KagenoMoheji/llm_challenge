content:
  - headline: はじめに
    body: |
      復活後2本目です！  
      復活前にVibe個人開発してたものがまだあるので続々投稿しますｗ

      では本題、今回Vibe個人開発したものはマークダウンパーサです。  
      `marked`などのマークダウンパーサがありますが、そもそも従来のマークダウン記法に対してちょっと不満に思ってたことがあり、自作するに至りました。
      
      どんな不満かというと、下記です。
      - `**hoge**`と`__hoge__`で太字にする重複の役割にしていてもったいない。もっと違う役割分け与えようよ。
      - 下線のマークダウン無いの？
      - 図・表・コードブロックのキャプション付けられない？
      - コードブロックで出力部分をセットで書けない？
      - 直感的に空行入れらんねぇ
      - 箇条書きで点リスト(？)と番号付きリストとチェックリストの、インデントによる階層化含む混同がうまくパースされねぇ
      - info・warning・alertのマークダウン無いの？ (でもQiitaを始め記法バラバラだけど最近出てきてはいるな…)
  - headline: monomdご紹介
    body: |
      下記で公開しています。
      - [monomdのDemo](https://kagenomoheji.github.io/llm_challenge/monomd/workspace/sample.html)
      - [Github](https://github.com/KagenoMoheji/llm_challenge/tree/main/monomd)
      - [npm](https://www.npmjs.com/package/monomd?activeTab=readme)

      自分が作る各種アプリでも使おうとして取り急ぎnpmにも出してますが、しっかりしたパッケージにまだしていないので、ひとまず下記の感じで入れて試してください…。
      ```
      <script src="https://cdn.jsdelivr.net/npm/monomd@1.0.6/index.js"></script>
      ```

      前述の各不満に対してどう対応したか、述べていきます。
      ### 重複の役割にしていてもったいない
      `__hoge__`を下線としてレンダリングするようにしました。  
      太字は`**hoge**`のみです。

      ### 図・表・コードブロックのキャプション付けられない？
      図は従来通りの`\!\[caption\](path)`からキャプションをレンダリングするようにしました。  
      表・コードは以下のcaption部分の記法でキャプションを出せます。
      ```md
      | Product | Price |[caption]
      |---------|------:|
      | Apple | $1.20 |
      | Banana | $0.50 |
      
      \`\`\`python[caption]
      print("Hello, MonoMD!")
      \`\`\`
      ```

      ### コードブロックで出力部分をセットで書けない？
      ```
      \`\`\`python
      print("Hello, MonoMD!")
      \:\:\:output
      Hello, MonoMD!
      \:\:\:
      \`\`\`
      ```
      上記のように`:::output ～ :::`を挟んだ部分がコードブロックのコードに対する出力としてセットで見せられるようにしました。  
      レンダリング結果は以下になります。
      ```python
      print("Hello, MonoMD!")
      :::output
      Hello, MonoMD!
      :::
      ```

      ### 直感的に空行入れらんねぇ
      ```
      上記のような改行だけの空行を入れて、圧縮されないまま空行としてレンダリングされるようにしました。


      こんな感じに。
      ```
      上記のような改行だけの空行を入れて、圧縮されないまま空行としてレンダリングされるようにしました。


      こんな感じに。

      ### 箇条書きで点リスト(？)と番号付きリストとチェックリストの、インデントによる階層化含む混同がうまくパースされねぇ
      ```
      - 点リスト
        1. 番号付リスト
          - [ ] チェックリスト
          - 点リスト
        1. 番号付きリスト
        - [x] チェックリスト
          1. hoge  ※半角スペース2つ入り
            aaaa  ※半角スペース2つ入り
            \`\`\`
            aaaa
            \`\`\`
        - 点リスト
        1. 番号付きリスト
      ```
      上記のレンダリング結果が下記です。良い感じじゃなかろうか←
      - 点リスト
        1. 番号付リスト
          - [ ] チェックリスト
          - 点リスト
        1. 番号付きリスト
        - [x] チェックリスト
          1. hoge  
            aaaa  
            ```
            aaaa
            ```
        - 点リスト
        1. 番号付きリスト

      ### info・warning・alertのマークダウン無いの？
      ```
      \:\:\:info
      informationです
      \:\:\:
      \:\:\:warn
      warningです
      \:\:\:
      \:\:\:alert
      critical alertです
      \:\:\:
      ```
      上記のレンダリング結果が下記です。
      :::info
      informationです
      :::
      :::warn
      warningです
      :::
      :::alert
      critical alertです
      :::
  - headline: まとめ
    body: |
      LLMに作らせるとすぐ実現できちゃいますね。  
      イタリックや上付きやMermaidとか、まだ未実装のものもあるので今後も改修を適宜入れていきたいかもですね。  
      あるいは`npm install`できるちゃんとしたnpmパッケージにしたり、Wasm化とかで高速化したりですかね～。