creator: KagenoMoheji
createDate: 2017-02-20
updateDate: !!timestamp 2017-02-20
title: 『Reegのプログラミング開発日記』を開設！
tags:
  - お知らせ
content:
  - headline: 初めの挨拶
    body: |
      皆さんこんにちは、初めまして。  
      私、Reegの初めてのHTML＆CSSのみで構築したブログサイト『Reegのプログラミング開発日記』がついに公開となりました！  
      (∩´∀｀)∩ﾜｧｰｲ
  - headline: 現状と今後
    body: |
      ![作業画面](media/2017001_working.PNG)
      画像は、実際の作業画面であり、**HTMLとCSSのみ**のファイルしか存在しないことがお分かりいただけると思います。  
      公開した現時点では、HTMLとCSSしか学習しておらず、使えていないので、完全なるサイトの完成とは言えません。  
      **ブログのタグ付けがなされておらず、閲覧者の皆さんに少々ご不便おかけたり、更新作業の面倒さがある**となどという問題点もところどころございます。  
      これらは、今後**JavaScript**や**Sass・Scss**の学習も交えて改良していく所存です。
  - headline: これまでのやり方と現在への転換
    body: |
      実を言いますと、このサイトの以前もサイト制作をしていたのですが、これらは０からHTMLやCSSを使って構築していたわけではないのです。  
      [Wix](https://ja.wix.com/)や[Jimdo](https://jp.jimdo.com/)というHP構築サイトを用いて、簡単に作っていました。  
      しかしやはり情報系学生としては、言語に触れながらという作業をしたいもので、このサイトを制作するにあたって、HTMLやCSSなどで構築しようと思い学習を始めたのです。
  - headline: このサイトについて
    body: |
      こちらのサイトの方針や、私、Reegについては、Aboutページにて説明しています。  
      まだまだプログラミングについては未熟な私ですが、このサイトの改良も加え、見守っていただけたらと思います。どうぞお手柔らかによろしくお願いします。m(__)m  
      
      また、この日記や、Aboutをご覧いただいた皆さんにだけお伝えしますが、実は、左サイドバーの「こんな本を購読しています」というテキストから、隠れページとなっている、紹介されている本について詳しく書いているページに飛ぶことができるようになっています。ぜひ、ご覧になってください( *´艸｀)