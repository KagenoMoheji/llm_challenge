creator: KagenoMoheji
createDate: 2019-04-19
updateDate: !!timestamp 2019-10-09
title: Macで欲しいアレコレをAutomatorで
tags:
  - Mac
content:
  - headline: Mac使い始めました
    body: |
      こんにちは～．  
      普段はWindows，Linux(ﾁｮｯﾄ)なんですが，研究室の貸出PCがMacだったので使い始めました．
      
      そこで「Automator」というアプリケーションを初めて知り，まぁWindowsのbashと同じなんですけど，Macの~~クソな~~…じゃない，不便なかゆいところをWindowsユーザにとって馴染んだ使い方に近づけられるように弄れるということで，個人的に弄った箇所を随時書き加えていこうかなと思います．
  - headline: 【1】同アプリを新規タブで開きたいな？
    body: |
      Chromeとかのブラウザや，システム環境設定，Finder，ターミナルなどを複数開きたい時があると思います．  
      ですが普通に既存のApplicationに配置されたアイコンをクリックしたのでは，
      - 既に起動している同アプリのところのところに(異なる仮想デスクトップであっても)移動してしまう．
      - システム環境設定とか，いちいち移動がめんどくさいんじゃ！！！
      ってことがあると思います．
      こういうときに別ウィンドウでアプリが起動すると良いですよね～．
      
      それを実現するやり方は以下です．
      
      ### ①Automatorを起動・新規作成
      - 「アプリケーション」を選択．
      - 左サイドバーから，「ユーティリティ」「シェルスクリプトを実行」を選択し，「シェルスクリプトを実行」を右の広いスペースにドラッグ＆ドロップ．
      - 右の作業スペースにて下記とする．
        - シェル：/bin/bash
        - 入力の引き渡し方法：引数として
      - スクリプトを書くところに以下を入力．  
        ```bash[GoogleChromeを新規で開く例]
        open -n "../../Applications/Google Chrome.app"
        ```
      上記のダブルクォーテーション`""`は書いたほうが良いです．スペースを含むファイル名とかでは書かないと正常に認識されません．  
      また`""`のパスについては，デフォルトでUsersからになっているので，そこからの相対パスになります．  
      ちなみに他のアプリケーションの場合は…
      ```bash[システム環境設定]
      ../../Applications/System Preferences.app
      ```
      ```bash[ターミナル]
      ../../Applications/Utilities/Terminal.app
      ```
      Finderに関してはなんかできなかったです．残念なことに．  
      いちいち右クリックして「新規Finderウィンドウ」を押すのも面倒だったんですが，しょうがないんでショートカットキー「Command＋N」で妥協します（まぁWindowsもフォルダアイコンをクリックして新規タブ開いてなかったしなそういや．いつも「スタート＋E」だったわ笑）

      ### ②保存してアイコン変更
      保存名は例えば`新規GoogleChrome.app`とか`新規ターミナル.app`とかでいいんじゃないでしょうか．  
      保存場所はApplications(アプリケーション)下で良いと思います．
      
      続いてアイコン変更ですが，作成したアプリケーションと，アイコンにしたいアプリケーションのそれぞれを右クリックして「情報を見る」で開きます．  
      すると左上にアプリケーションのアイコンが表示されています．  
      これを(クリックして外枠が出たのを確認してから)`Command＋C`でアイコンをコピーし，作成したアプリケーションのアイコンに`Command＋V`でペーストすればアイコンが変わります．
      
      ということで以上っ！あとはDockに追加するなりしましょう．

      #### ※2019/10/09更新※
      MacOS Catalinaから下記の変更をしないと動作しない場合があるようです．
      - `../../Applications/` -> `../../System/Applications/`
      
      【参考】
      - [1][Macのアイコンを変更する3つの方法 | D-Box](https://do-zan.com/mac-change-icon/#i-3)
      - [2]シェルスクリプト-スペースが含まれる文字列を扱う | Capm Network(http://capm-network.com/?tag=%E3%82%B7%E3%82%A7%E3%83%AB%E3%82%B9%E3%82%AF%E3%83%AA%E3%83%97%E3%83%88-%E3%82%B9%E3%83%9A%E3%83%BC%E3%82%B9%E3%81%8C%E5%90%AB%E3%81%BE%E3%82%8C%E3%82%8B%E6%96%87%E5%AD%97%E5%88%97%E3%82%92%E6%89%B1%E3%81%86 だったがリンク切れ)
      - [3][Macの Finder.appはどこにあるか | 頭ん中](https://www.msng.info/archives/2013/01/where-finder-is.php)
      - [4][“Command＋E”で新規Finderを開くように設定したら超便利な件について | Moxbit](https://www.moxbit.com/2012/03/mac-new-finder-come)
  - headline: 【2】フォルダからVSCodeを起動したいな？
    body: |
      VSCodeをダウンロードしました．ここまでは良いです．  
      でもWindowsではフォルダ内の空白部分に右クリックしてコンテキストメニューを出してそこからフォルダごとプロジェクトとしてVSCodeに開くことができるのですが…．  
      Macにはすんなりコンテキストメニューに追加されないようですね．  
      ということでコンテキストメニューに追加してみましょう．
      - 「クイックアクション」を選択．
      - 左サイドバーから，「ユーティリティ」「シェルスクリプトを実行」を選択し，「シェルスクリプトを実行」を右の広いスペースにドラッグ＆ドロップ．
      - 右上のプルダウンで選択する部分で下記とする．
        - ワークフローが受け取る現在の項目：ファイルまたはフォルダ
        - 検索対象：Finder.app
        - イメージ：お好きに．
        - カラー：お好きに．
      - 右の作業スペースにて下記とする．
        - シェル：/bin/bash
        - 入力の引き渡し方法：引数として
      - スクリプトを書くところに以下を入力．  
        ```bash
        for f in "$@"; do
          open -a 'Visual Studio Code' "$f"
        done
        ```
      これで「VSCodeで開く.workflow」とかにして保存します．
      保存場所はシステムが固定にしていて，"Users/(ユーザ名)/Library/Services/"下にあります．基本隠しフォルダになってます．
      
      これで，VSCodeに開きたい
      - フォルダを右クリックして`サービス＞VSCodeで開く`
      - ファイルを右クリックして`VSCodeで開く`
      という風にコンテキストメニューで確認できればOKです．  
      無かったら，`システム環境設定＞キーボード＞ショートカット＞サービス＞ファイルとフォルダ`にあればチェックを付けて再チャレンジしてみてください．
      
      …とはいえ「サービス」を経由しないといけないのなんかなぁ…．  
      更に，Windowsでは開きたいフォルダ内の空きスペースを右クリックしても`VSCodeで開く`ができるのですが，Macではできませんね…．
      
      【参考】
      - [5][OSX: how to add a right click option in folder to open the folder with an application like VS Code? | StackExchange](https://apple.stackexchange.com/questions/238948/osx-how-to-add-a-right-click-option-in-folder-to-open-the-folder-with-an-applic/348444#348444)
  - headline: まとめ
    body: |
      Automatorは便利…っちゃそうですが，【1】について，欠点があります．  
      アプリを終了させたときにDockにたくさんアイコンが残っちゃうことです．  
      削除処理がめんどくさいですね…アプリ終了時にDockから消すスクリプト無いかな～？