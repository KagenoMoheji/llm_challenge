                  case 3:
                      //ハイスコアの更新
                      bestscore=(pc.score>bestscore) ? pc.score:bestscore;

                      if(((~*ptr2)&KEY_ALL)==KEY_A){ // Aボタンが押されたら
                          deleteAll();
                          *(TIMER0)=0xFF00;
                          scene=0;
                          break;
                      }

                      //ゲームオーバーコメント（点滅）描写
                      cx=9,cy=12;
                      locate(cx,cy,0);
                      if(flushFlag==0){
                          prints("GAME OVER...",BLUE);
                          flushFlag=1;
                      }else{
                          prints("            ",WHITE);
                          flushFlag=0;
                      }

                      //リセットのアナウンス描写
                      cx=5,cy=13;
                      locate(cx,cy,0);
                      prints("Push key_A to reset.",WHITE);
                      sleep(500000);
                      break;
              }
          }

          /*停止処理*/
          while(1);
          return 0;
