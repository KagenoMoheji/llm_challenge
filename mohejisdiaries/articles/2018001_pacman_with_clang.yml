          hword dm;                                        //0:右方向、1:左方向、2:上方向、3:下方向
          hword dn,color;
      }ENEMY;
                                                  
      /* 関数 */
      void locate(hword,hword,hword);                      //8x8を1マスとしたときの、描写開始点（8x8の左上）の座標を返す
      void draw_point(hword,hword,hword);                  //ドット描写
      void createPacman(PACMAN*);                          //PAC-MANの初期値設定
      void createEnemy(ENEMY*,hword,hword,hword,hword);    //モンスターの初期値設定ー
      void movePacman(PACMAN*);                            //PAC-MANの座標更新、描写
      void moveEnemy(ENEMY*);                              //モンスターの座標更新、描写
      void keyopr(PACMAN*);                                //キー操作
      hword collideWithEnemy(PACMAN*,ENEMY*);              //モンスターとの衝突判定
      hword colorJudge(PACMAN*,hword);                     //接触した色の判定（要は壁との衝突判定）
      void prints(byte*,hword);                            //ASCII文字列の描写
      void printn(hword,hword);                            //ASCII数字列の描写
      void drawDots(hword,hword,hword);                    //8x8ドット絵（PAC-MAN、モンスター、壁）の描写
      hword rand(hword,hword);                             //ランダム関数
      void timer(hword);                                   //タイマー関数
      hword issue_mask(hword);                             //まぁこれはようはあれだ。
      hword power(int,hword);                              //累乗演算関数
      hword div(hword,hword);                              //除算関数
      hword remainder(hword,hword);                        //剰余演算関数
      void sleep(int);                                     //停止関数
      void deleteAll(void);                                //画面初期化関数
                                                  
      /* グローバル変数 */
      hword *ptr,*ptr2;                                    //描写のポインタ、キー操作のポインタ
      POINT p;                                             //構造体POINTのインスタンス（？）
      hword cx,cy;                                         //240x160での座標
      hword scene=0;                                       //0:タイトル画面、1:プレイ中画面、2:クリア画面、3:ゲームオーバー画面
      hword dotWidth=LENGTHOF(*char8x8);                   //dot_aisle、dot_pacman、dot_enemyも同じ幅。
      hword flushFlag=0;                                   //点滅・モーション描写の際の切り替えフラグ
      hword time,retime=0,limit=240;                       //ゲーム制限時間(4分)
      hword bestscore=0;                                   //ハイスコア

      /* main関数 */
      int main(void){
          /*GBA画面初期化*/
          ptr=(hword*)IOBASE;
          *ptr=0xF03;

          ptr2=(hword*)KEY_STATUS;

          hword x,y;
          PACMAN pc;//パックマンの構造体を定義
          ENEMY e1,e2,e3,e4,e5,e6,e7;//敵（7匹）の構造体を定義

          while(1){
              switch(scene){
                  case 0:/*タイトル画面*/
                      if(((~*ptr2)&KEY_ALL)==KEY_START){ // STARTボタンが押されたら
                          hword i;
                          for(i=0;i&#60;3;i++){ // スリーカウント
                              cx=13,cy=8;
                              locate(cx,cy,0);
                              printn(3-i,WHITE);
                              sleep(2000000);
                          }
                          flushFlag=0;

                          //コースの描写
                          for(y=0;y&#60;LCD_CHAR_HEIGHT;y++){
                              for(x=0;x&#60;LCD_CHAR_WIDTH;x++){
                                  locate(x,y,0);
                                  drawDots(course[y][x],0,3);//colorは決まってるので無視
                              }
                          }
                          //ハイスコアの描写
                          cx=1,cy=0;
                          locate(cx,cy,0);
                          prints("HS:",WHITE);
                          cx=4,cy=0;
                          locate(cx,cy,0);
                          printn(bestscore,WHITE);
                          //パックマンの生成
                          createPacman(&pc);
                          //敵（7匹）の生成
                          createEnemy(&e1,116,36,0,MAGENTA);
                          createEnemy(&e2,120,65,1,CYAN);
                          createEnemy(&e3,58,102,2,GREEN);
                          createEnemy(&e4,13,11,0,BLUE);
                          createEnemy(&e5,194,36,1,RED);
                          createEnemy(&e6,202,94,2,BLUE);
                          createEnemy(&e7,116,133,2,MAGENTA);
                          
                          //シーン切り替え
                          scene=1;
                          break;
                      }

                      //タイトル描写
                      cx=11,cy=2;
                      locate(cx,cy,0);
                      prints("PAC-MAN",YELLOW);
                      cx=9,cy=3;
                      locate(cx,cy,0);
                      prints("Level is...",WHITE);
                      cx=6,cy=4;
                      locate(cx,cy,0);
                      prints("Never be cleared!",WHITE);
                      cx=1,cy=10;
                      locate(cx,cy,0);
                      prints("Full Score is 569.",WHITE);
                      //イントロ描写
                      cx=1,cy=11;
                      locate(cx,cy,0);
                      prints("HS is High Score.",WHITE);
                      cx=1,cy=13;
                      locate(cx,cy,0);
                      prints("Push UP or DOWN or RIGHT or",WHITE);
                      cx=1,cy=14;
                      locate(cx,cy,0);
                      prints("LEFT to move PAC-MAN.",WHITE);

                      //（点滅仕様の）アナウンス描写
                      cx=3,cy=16;
                      locate(cx,cy,0);
                      if(flushFlag==0){
                          prints("Push START to start game.",WHITE);
                          flushFlag=1;
                      }else{
                          prints("                         ",WHITE);
                          flushFlag=0;
                      }

                      sleep(1000000);
                      break;
                  case 1:
                      //タイマーON
                      TIMER_ON(10);

                      while(1){
                          if(((~*ptr2)&KEY_ALL)!=0){ // キーのいずれかが押されたら
                              keyopr(&pc);
                          }
                          
                          //パックマンの座標更新
                          movePacman(&pc);
                          //敵（7匹）それぞれの座標更新
                          moveEnemy(&e1);
                          moveEnemy(&e2);
                          moveEnemy(&e3);
                          moveEnemy(&e4);
