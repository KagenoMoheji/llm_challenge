      #define SET_TIMER1 (hword*)0x04000106
      #define SET_TIMER2 (hword*)0x0400010A
      #define SET_TIMER3 (hword*)0x0400010E
      #define TM_SET0 0x0000                              //制御設定（タイマOFF，割込みOFF，カスケードOFF，プリスケーラなし）
      #define TM_SET1 0x0080                              //制御設定（タイマON，割込みOFF，カスケードOFF，プリスケーラなし）
      #define TM_SET2 0x0084                              //制御設定（タイマON，割込みOFF，カスケードON，プリスケーラなし）
      #define TIMER_ON(l) timer(l)
      #define TIMER_OFF (*((hword *)0x04000102) = 0x0000)
      #define LENGTHOF(array) (sizeof(array)/sizeof(*array))
      typedef unsigned short hword;
