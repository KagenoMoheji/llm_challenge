      #define KEY_ALL		0x03FF                         // All key bits
      #define TIMER0 (hword*)0x04000100
      #define TIMER1 (hword*)0x04000104
      #define TIMER2 (hword*)0x04000108
      #define TIMER3 (hword*)0x0400010C
