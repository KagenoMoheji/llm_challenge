creator: KagenoMoheji
createDate: 2017-02-22
updateDate: !!timestamp 2017-02-22
title: 情シスとインテリの違いは？
tags:
  - 雑感
content:
  - headline: 同志社の情報系学科の２つ。
    body: |
      どうも！今回は私が所属している同志社大学情報システムデザイン学科（以下情シス）と、もう一つの情報系学科・インテリジェント情報工学科（以下インテリ）について話していこうと思います。
      
      似てますよねぇ、内容的に区別つきませんね！というか完全に同じやないか！って思う人も少なくないと思います。言うて、学習する言語も、時期は違えどJavaとCで同じだし、HPとかパンフレットとか読んでても一見同じ内容に見えますよね(´･ω･｀)
      
      ところがどっこい、よくよく考えて比べてみると、内容的に違ってきているのが分かります。
  - headline: ２つの学科の違い
    body: |
      __・インテリジェント情報工学科__  
      **工学・数学寄りで、エンジニア的学習要素が濃い。**

      __・情報システムデザイン学科__  
      **経営学寄りで、経営システム関連の学習要素が濃い。**
      
      ・・・とまぁ、ざっくり言うと、こうなります。なんとなく見えました？  
      だからなんですよ、シラバスとか履修要項とかを見てもらうと分かるのですが、インテリは「情報工学」という科目があり、（学習内容は分からないが）エンジニアっぽくて専門っぽいです。一方で情シスの科目には「社会のしくみ」だったり、「人間と情報システム」だったりと、社会を連想させ、関連しているような科目が多く目にします。そんな違いなんです。  
      だからというのもあるのですが、もう一つ違いがあり、インテリは**純粋な理系学生**で満たされているのに対し、情シスは**文系による受験の方法も含まれており、文系学生も一部いる**ということになっています。
  - headline: このことを知った私は？
    body: |
      いやね、これを知った時、「入ったとこ間違えたか？」って一瞬思いましたわ＼(゜ロ＼)ココハドコ? (／ロ゜)／マチガエタ?  
      ぜんっぜん違い分からないまま「こっちだ！」って情シス選んで受験してましたからね？まぁいいですけど(´ﾟдﾟ｀)  
      プログラミングの勉強も一応できるし、社会について学べることから視野を広げる分には悪くないし、何より、~~「講義に出てれば単位を取れる楽勝学科（By 同志社理工教授）」~~らしいし？(´･д･｀)
  - headline: 最後の一言
    body: |
      まぁ学習内容は違えど、遠い親戚みたいなもんです、どちらの専門を取るかは、受験生次第になりますが。  
      このサイトを参考にして受験生も道誤らないように導けれたら嬉しいですねｗｗｗ( *´艸｀)